services:
  agent:
    build: .
    image: skport:chrome
    command: bash agent-entrypoint.sh
    environment:
      SKPORT_STATE_FILE: /app/data/storage_state.json
      SKPORT_DATA_DIR: /app/data
      SKPORT_SCREENSHOT_DIR: /app/data/screenshots
    ports:
      - "8081:8080"
    volumes:
      - ./data:/app/data
    env_file:
      - path: .env
        required: false
