<!doctype html>
<html lang="{{ html_lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ t('ui.title') }}</title>
    <script>
      // 테마는 기기별 localStorage에 저장 (백엔드 저장 불필요). 페인트 전에 확정해 플래시 방지
      document.documentElement.dataset.theme =
        localStorage.getItem("skport-theme") ||
        (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <style>
      :root {
        --bg: #eef1f6;
        --card: #ffffff;
        --fg: #1b2430;
        --muted: #5c6b80;
        --line: #dde3ec;
        --accent: #2563eb;
        --accent-fg: #ffffff;
        --ok: #15803d;
        --info: #1d4ed8;
        --warn: #b45309;
        --err: #b91c1c;
        --neutral: #64748b;
        --code-bg: #0e1524;
        --code-fg: #cfe0f5;
      }
      [data-theme="dark"] {
        --bg: #0e1420;
        --card: #1a2331;
        --fg: #e7eef8;
        --muted: #94a5bb;
        --line: #2b3849;
        --accent: #4f8ef7;
        --accent-fg: #0b1220;
        --ok: #4ade80;
        --info: #7aa7ff;
        --warn: #fbbf24;
        --err: #f87171;
        --neutral: #94a3b8;
        --code-bg: #0a101c;
        --code-fg: #cfe0f5;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, "Segoe UI", Roboto, "Noto Sans KR", "Noto Sans JP",
          sans-serif;
        background: var(--bg);
        color: var(--fg);
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 16px 40px;
        transition: background 0.2s, color 0.2s;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 22px;
      }
      h2 {
        font-size: 15px;
        letter-spacing: 0.02em;
        color: var(--muted);
        margin: 22px 0 10px;
      }
      a {
        color: var(--accent);
      }
      .head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 12px;
      }
      .intro {
        margin: 4px 0;
        color: var(--muted);
      }
      .icon-btn {
        font-size: 18px;
        line-height: 1;
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
      }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
        gap: 10px;
      }
      .card {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 14px 16px;
      }
      .card .label {
        display: block;
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 8px;
      }
      .card .value {
        font-size: 15px;
        font-weight: 600;
      }
      .badge {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 13px;
        background: rgba(100, 116, 139, 0.15);
        color: var(--neutral);
      }
      .badge[data-status="success"] {
        background: rgba(21, 128, 61, 0.15);
        color: var(--ok);
      }
      .badge[data-status="already"] {
        background: rgba(29, 78, 216, 0.15);
        color: var(--info);
      }
      .badge[data-status="login_required"] {
        background: rgba(180, 83, 9, 0.15);
        color: var(--warn);
      }
      .badge[data-status="error"] {
        background: rgba(185, 28, 28, 0.15);
        color: var(--err);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      button {
        font: inherit;
        padding: 8px 16px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
      }
      button:hover:not(:disabled) {
        border-color: var(--accent);
      }
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: var(--accent-fg);
      }
      button.danger {
        color: var(--err);
      }
      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      fieldset {
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        margin: 10px 0;
        padding: 12px 16px;
      }
      legend {
        font-size: 13px;
        color: var(--muted);
        padding: 0 6px;
      }
      label {
        display: block;
        margin: 8px 0;
      }
      input[type="text"],
      input[type="password"],
      select {
        width: 100%;
        max-width: 420px;
        font: inherit;
        color: var(--fg);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 6px 8px;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
      }
      pre {
        background: var(--code-bg);
        color: var(--code-fg);
        padding: 12px;
        border-radius: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        font-size: 12.5px;
        max-height: 340px;
        overflow: auto;
      }
    </style>
  </head>
  <body>
    <header class="head">
      <div>
        <h1>{{ t('ui.title') }}</h1>
        <p class="intro">{{ t('ui.intro') }}</p>
        <p>
          <a href="/vnc.html">{{ t('ui.vnc_link') }}</a>
          <span class="hint">{{ t('ui.vnc_hint') }}</span>
        </p>
      </div>
      <button
        id="themeBtn"
        class="icon-btn"
        onclick="toggleTheme()"
        aria-label="{{ t('ui.theme_toggle') }}"
        title="{{ t('ui.theme_toggle') }}"
      >
        🌙
      </button>
    </header>

    <h2>{{ t('ui.status') }}</h2>
    <div class="grid">
      <div class="card">
        <span class="label">{{ t('ui.result') }}</span>
        <b id="st" class="badge">-</b>
      </div>
      <div class="card">
        <span class="label">{{ t('ui.last_run') }}</span>
        <span class="value" id="last">-</span>
      </div>
      <div class="card">
        <span class="label">{{ t('ui.next_run') }}</span>
        <span class="value" id="next">-</span>
      </div>
      <div class="card">
        <span class="label">{{ t('ui.session') }}</span>
        <span class="value" id="sess">-</span>
      </div>
    </div>

    <h2>{{ t('ui.settings') }}</h2>
    <p>
      <label
        >{{ t('ui.language') }}:
        <select id="lang" onchange="setLang(this.value)">
          {% for code in langs %}
          <option
            value="{{ code }}"
            {% if code == lang %}selected{% endif %}
          >
            {{ lang_labels[code] }}
          </option>
          {% endfor %}
        </select></label
      >
    </p>
    <fieldset>
      <legend>{{ t('ui.notifications') }}</legend>
      <label
        ><input type="checkbox" id="tg" checked /> {{ t('ui.telegram') }}</label
      >
      <label
        >{{ t('ui.bot_token') }}:
        <input
          type="password"
          id="botToken"
          placeholder="{{ t('ui.keep_saved') }}" />
        <span class="hint" id="botTokenState"></span
      ></label>
      <label
        >{{ t('ui.chat_id') }}:
        <input type="text" id="chatId" placeholder="{{ t('ui.chat_id_ph') }}"
      /></label>
      <label
        >{{ t('ui.mention_id') }}:
        <input
          type="text"
          id="mentionId"
          placeholder="{{ t('ui.mention_id_ph') }}"
        />
        <span class="hint">{{ t('ui.mention_hint') }}</span></label
      >
      <label
        ><input type="checkbox" id="dc" checked /> {{ t('ui.discord') }}</label
      >
      <label
        >{{ t('ui.webhook') }}:
        <input
          type="password"
          id="discordUrl"
          placeholder="{{ t('ui.keep_saved') }}" />
        <span class="hint" id="discordUrlState"></span
      ></label>
      <div class="actions">
        <button class="primary" onclick="save()">{{ t('ui.save') }}</button>
        <button onclick="clearField('telegram_bot_token')">
          {{ t('ui.clear_token') }}
        </button>
        <button onclick="clearField('discord_webhook_url')">
          {{ t('ui.clear_webhook') }}
        </button>
      </div>
    </fieldset>

    <div class="actions">
      <button class="primary" onclick="post('/api/cycle')">
        {{ t('ui.run_now') }}
      </button>
      <button onclick="post('/api/login')">{{ t('ui.open_login') }}</button>
      <button id="closeBtn" class="danger" onclick="post('/api/close')">
        {{ t('ui.close_browser') }}
      </button>
    </div>

    <h2>{{ t('ui.log') }}</h2>
    <pre id="log"></pre>
    <script>
      const $=id=>document.getElementById(id);
      // 폴링 갱신 문자열은 서버가 현재 언어로 렌더해 넘긴다 (JS에 사전을 두지 않는다)
      const STATUS_TEXT={{ status_text|tojson }};
      const TEXT={saved:{{ t('ui.saved')|tojson }},notSet:{{ t('ui.not_set')|tojson }},
        sessionYes:{{ t('ui.session_yes')|tojson }},sessionNo:{{ t('ui.session_no')|tojson }}};
      function toggleTheme(){
        const next=document.documentElement.dataset.theme==='dark'?'light':'dark';
        document.documentElement.dataset.theme=next;
        localStorage.setItem('skport-theme',next);
        paintThemeBtn();
      }
      function paintThemeBtn(){
        themeBtn.textContent=document.documentElement.dataset.theme==='dark'?'☀️':'🌙';
      }
      paintThemeBtn();
      const _dirty={botToken:false,chatId:false,mentionId:false,discordUrl:false};
      ['botToken','chatId','mentionId','discordUrl'].forEach(id=>{
        $(id).addEventListener('input',()=>{_dirty[id]=true;});
      });
      async function post(u){await fetch(u,{method:'POST'});tick();}
      async function setLang(v){
        // 언어 자체를 먼저 저장하고 새 언어로 다시 그린다 (미저장 입력값은 사라짐)
        await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:v})});
        location.reload();
      }
      function payload(){
        const body={telegram:$('tg').checked,discord:$('dc').checked};
        // 문자열 필드는 항상 전송(변경/삭제 반영). 시크릿은 입력했을 때만 전송 → 저장값 유지.
        body.telegram_chat_id=$('chatId').value;
        body.telegram_mention_id=$('mentionId').value;
        if(_dirty.botToken) body.telegram_bot_token=$('botToken').value;
        if(_dirty.discordUrl) body.discord_webhook_url=$('discordUrl').value;
        return body;
      }
      function resetDirty(){$('botToken').value='';$('discordUrl').value='';Object.keys(_dirty).forEach(k=>{_dirty[k]=false;});}
      async function save(){
        const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});
        if(r.ok) resetDirty();
        tick();
      }
      async function clearField(name){
        const body=payload();
        body[name]='';  // 명시적 삭제 → 환경변수 폴백으로 복귀
        const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(r.ok) resetDirty();
        tick();
      }
      async function tick(){
       try{const r=await fetch('/api/status');const s=await r.json();
       st.textContent=STATUS_TEXT[s.last_status]||s.last_status||'-';
       st.dataset.status=s.last_status||'';
       last.textContent=s.last_run;next.textContent=s.next_run;
       tg.checked=s.settings.telegram;dc.checked=s.settings.discord;
       botTokenState.textContent=s.settings.telegram_configured?TEXT.saved:TEXT.notSet;
       discordUrlState.textContent=s.settings.discord_configured?TEXT.saved:TEXT.notSet;
       if(!_dirty.chatId) chatId.value=s.settings.telegram_chat_id||'';
       if(!_dirty.mentionId) mentionId.value=s.settings.telegram_mention_id||'';
       sess.textContent=s.has_session ? TEXT.sessionYes : TEXT.sessionNo;
       closeBtn.disabled=!s.login_open;  // 브라우저가 열려 있을 때만 종료 가능
       log.textContent=s.log.slice().reverse().join('\n');}catch(e){}
      }
      setInterval(tick,5000);tick();
    </script>
  </body>
</html>
