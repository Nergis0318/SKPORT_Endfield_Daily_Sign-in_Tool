<!doctype html>
<html lang="{{ html_lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{ t('ui.title') }}</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 900px;
        margin: 20px auto;
        padding: 0 12px;
      }
      pre {
        background: #f4f4f4;
        padding: 8px;
        white-space: pre-wrap;
      }
      button {
        padding: 6px 14px;
        margin: 4px 4px 4px 0;
      }
      fieldset {
        border: 1px solid #ccc;
        border-radius: 6px;
        margin: 10px 0;
        padding: 10px 12px;
      }
      label {
        display: block;
        margin: 6px 0;
      }
      input[type="text"],
      input[type="password"] {
        width: 100%;
        max-width: 420px;
        padding: 4px;
      }
      .hint {
        color: #666;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h1>{{ t('ui.title') }}</h1>
    <p>{{ t('ui.intro') }}</p>
    <p><a href="/vnc.html">{{ t('ui.vnc_link') }}</a> {{ t('ui.vnc_hint') }}</p>
    <h2>{{ t('ui.status') }}</h2>
    <ul>
      <li>{{ t('ui.result') }}: <b id="st">-</b></li>
      <li>{{ t('ui.last_run') }}: <span id="last">-</span></li>
      <li>{{ t('ui.next_run') }}: <span id="next">-</span></li>
      <li>{{ t('ui.session') }}: <span id="sess">-</span></li>
    </ul>
    <h2>{{ t('ui.settings') }}</h2>
    <p>
      <label
        >{{ t('ui.language') }}:
        <select id="lang" onchange="setLang(this.value)">
          {% for code in langs %}
          <option
            value="{{ code }}"
            {% if code == lang %}selected{% endif %}
          >
            {{ lang_labels[code] }}
          </option>
          {% endfor %}
        </select></label
      >
    </p>
    <fieldset>
      <legend>{{ t('ui.notifications') }}</legend>
      <label
        ><input type="checkbox" id="tg" checked /> {{ t('ui.telegram') }}</label
      >
      <label
        >{{ t('ui.bot_token') }}:
        <input
          type="password"
          id="botToken"
          placeholder="{{ t('ui.keep_saved') }}" />
        <span class="hint" id="botTokenState"></span
      ></label>
      <label
        >{{ t('ui.chat_id') }}:
        <input type="text" id="chatId" placeholder="{{ t('ui.chat_id_ph') }}"
      /></label>
      <label
        >{{ t('ui.mention_id') }}:
        <input
          type="text"
          id="mentionId"
          placeholder="{{ t('ui.mention_id_ph') }}"
        />
        <span class="hint">{{ t('ui.mention_hint') }}</span></label
      >
      <label
        ><input type="checkbox" id="dc" checked /> {{ t('ui.discord') }}</label
      >
      <label
        >{{ t('ui.webhook') }}:
        <input
          type="password"
          id="discordUrl"
          placeholder="{{ t('ui.keep_saved') }}" />
        <span class="hint" id="discordUrlState"></span
      ></label>
      <div>
        <button onclick="save()">{{ t('ui.save') }}</button>
        <button onclick="clearField('telegram_bot_token')">
          {{ t('ui.clear_token') }}
        </button>
        <button onclick="clearField('discord_webhook_url')">
          {{ t('ui.clear_webhook') }}
        </button>
      </div>
    </fieldset>
    <button onclick="post('/api/cycle')">{{ t('ui.run_now') }}</button>
    <button onclick="post('/api/login')">{{ t('ui.open_login') }}</button>
    <button id="closeBtn" onclick="post('/api/close')">
      {{ t('ui.close_browser') }}
    </button>
    <h2>{{ t('ui.log') }}</h2>
    <pre id="log"></pre>
    <script>
      const $=id=>document.getElementById(id);
      // 폴링 갱신 문자열은 서버가 현재 언어로 렌더해 넘긴다 (JS에 사전을 두지 않는다)
      const STATUS_TEXT={{ status_text|tojson }};
      const TEXT={saved:{{ t('ui.saved')|tojson }},notSet:{{ t('ui.not_set')|tojson }},
        sessionYes:{{ t('ui.session_yes')|tojson }},sessionNo:{{ t('ui.session_no')|tojson }}};
      const _dirty={botToken:false,chatId:false,mentionId:false,discordUrl:false};
      ['botToken','chatId','mentionId','discordUrl'].forEach(id=>{
        $(id).addEventListener('input',()=>{_dirty[id]=true;});
      });
      async function post(u){await fetch(u,{method:'POST'});tick();}
      async function setLang(v){
        // 언어 자체를 먼저 저장하고 새 언어로 다시 그린다 (미저장 입력값은 사라짐)
        await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:v})});
        location.reload();
      }
      function payload(){
        const body={telegram:$('tg').checked,discord:$('dc').checked};
        // 문자열 필드는 항상 전송(변경/삭제 반영). 시크릿은 입력했을 때만 전송 → 저장값 유지.
        body.telegram_chat_id=$('chatId').value;
        body.telegram_mention_id=$('mentionId').value;
        if(_dirty.botToken) body.telegram_bot_token=$('botToken').value;
        if(_dirty.discordUrl) body.discord_webhook_url=$('discordUrl').value;
        return body;
      }
      function resetDirty(){$('botToken').value='';$('discordUrl').value='';Object.keys(_dirty).forEach(k=>{_dirty[k]=false;});}
      async function save(){
        const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload())});
        if(r.ok) resetDirty();
        tick();
      }
      async function clearField(name){
        const body=payload();
        body[name]='';  // 명시적 삭제 → 환경변수 폴백으로 복귀
        const r=await fetch('/api/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
        if(r.ok) resetDirty();
        tick();
      }
      async function tick(){
       try{const r=await fetch('/api/status');const s=await r.json();
       st.textContent=STATUS_TEXT[s.last_status]||s.last_status;last.textContent=s.last_run;next.textContent=s.next_run;
       tg.checked=s.settings.telegram;dc.checked=s.settings.discord;
       botTokenState.textContent=s.settings.telegram_configured?TEXT.saved:TEXT.notSet;
       discordUrlState.textContent=s.settings.discord_configured?TEXT.saved:TEXT.notSet;
       if(!_dirty.chatId) chatId.value=s.settings.telegram_chat_id||'';
       if(!_dirty.mentionId) mentionId.value=s.settings.telegram_mention_id||'';
       sess.textContent=s.has_session ? TEXT.sessionYes : TEXT.sessionNo;
       closeBtn.disabled=!s.login_open;  // 브라우저가 열려 있을 때만 종료 가능
       log.textContent=s.log.slice().reverse().join('\n');}catch(e){}
      }
      setInterval(tick,5000);tick();
    </script>
  </body>
</html>
